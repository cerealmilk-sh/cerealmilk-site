<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 91.96 14" role="img" aria-label="Cereal Milk">
  <!-- Concept A (CER-6): the canonical pixel milk-bowl tile plus the
       CEREALMILK bitmap wordmark, packaged as one standalone lockup.
       Geometry and palette match brand/milk-bowl-mark (14x14 grid;
       wordmark from the hand-drawn 5x7 alphabet in Logo.tsx; word height
       is 0.64 of the tile per the LogoLockup spec). Wordmark inherits
       currentColor so it themes; the tile carries its own contrast. -->
  <rect width="14" height="14" rx="2.24" fill="#0a0a0a"/>
  <g shape-rendering="crispEdges">
    <!-- cereal -->
    <rect x="4" y="3" width="1" height="1" fill="#c4a86a"/>
    <rect x="7" y="2" width="1" height="1" fill="#c4a86a"/>
    <rect x="9" y="4" width="1" height="1" fill="#c4a86a"/>
    <!-- bowl: rim, milk steps, base -->
    <rect x="2" y="6" width="10" height="1" fill="#318dff"/>
    <rect x="2" y="7" width="10" height="1" fill="#ededed"/>
    <rect x="3" y="8" width="8" height="1" fill="#ededed"/>
    <rect x="4" y="9" width="6" height="1" fill="#ededed"/>
    <rect x="5" y="10" width="4" height="1" fill="#a1a1a1"/>
    <rect x="6" y="11" width="2" height="1" fill="#a1a1a1"/>
  </g>
