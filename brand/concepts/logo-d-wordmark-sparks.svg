      <rect x="16" y="3" width="2" height="1"/>
      <rect x="16" y="4" width="1" height="1"/>
      <rect x="18" y="4" width="1" height="1"/>
      <rect x="16" y="5" width="1" height="1"/>
      <rect x="19" y="5" width="1" height="1"/>
      <rect x="16" y="6" width="1" height="1"/>
