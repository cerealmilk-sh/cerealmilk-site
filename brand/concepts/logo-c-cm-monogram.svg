<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" role="img" aria-label="Cereal Milk monogram">
  <!-- Concept C (CER-6): a CM monogram tile for tight square spaces where
       even the bowl gets muddy (tiny embeds, third party chrome). The C
       and M come from the same hand-drawn 5x7 alphabet as the wordmark:
       C in milk, M in cereal gold, over an echo of the bowl (blue rim
       stripe on a milk step). Same 14x14 grid and palette as the mark. -->
  <rect width="14" height="14" rx="2.24" fill="#0a0a0a"/>
  <g shape-rendering="crispEdges">
    <!-- C, in milk -->
    <g fill="#ededed">
      <rect x="2" y="2" width="3" height="1"/>
      <rect x="1" y="3" width="1" height="1"/>
      <rect x="5" y="3" width="1" height="1"/>
      <rect x="1" y="4" width="1" height="1"/>
      <rect x="1" y="5" width="1" height="1"/>
      <rect x="1" y="6" width="1" height="1"/>
      <rect x="1" y="7" width="1" height="1"/>
      <rect x="5" y="7" width="1" height="1"/>
      <rect x="2" y="8" width="3" height="1"/>
    </g>
    <!-- M, in cereal gold -->
    <g fill="#c4a86a">
      <rect x="8" y="2" width="1" height="1"/>
      <rect x="12" y="2" width="1" height="1"/>
      <rect x="8" y="3" width="2" height="1"/>
      <rect x="11" y="3" width="2" height="1"/>
      <rect x="8" y="4" width="1" height="1"/>
      <rect x="10" y="4" width="1" height="1"/>
      <rect x="12" y="4" width="1" height="1"/>
      <rect x="8" y="5" width="1" height="1"/>
      <rect x="10" y="5" width="1" height="1"/>
      <rect x="12" y="5" width="1" height="1"/>
      <rect x="8" y="6" width="1" height="1"/>
      <rect x="12" y="6" width="1" height="1"/>
      <rect x="8" y="7" width="1" height="1"/>
      <rect x="12" y="7" width="1" height="1"/>
      <rect x="8" y="8" width="1" height="1"/>
      <rect x="12" y="8" width="1" height="1"/>
    </g>
    <!-- bowl echo: rim stripe over a milk step -->
    <rect x="1" y="10" width="12" height="1" fill="#318dff"/>
    <rect x="2" y="11" width="10" height="1" fill="#ededed"/>
  </g>
</svg>
