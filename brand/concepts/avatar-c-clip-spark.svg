<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" role="img" aria-label="clippy">
  <!-- Avatar C (CER-7): the clip holds the cereal. A milk-white paperclip
       with a single gold cereal square caught in its mouth, clippy doing
       its job. Highest contrast of the three, strongest read at 32px.
       Same 14x14 grid and palette, full-bleed square for social masks. -->
  <rect width="14" height="14" fill="#0a0a0a"/>
  <g shape-rendering="crispEdges">
    <!-- the clip, in milk white -->
    <g fill="#ededed">
      <rect x="6" y="2" width="3" height="1"/>
      <rect x="5" y="3" width="1" height="7"/>
      <rect x="7" y="4" width="1" height="7"/>
      <rect x="9" y="3" width="1" height="8"/>
      <rect x="7" y="11" width="3" height="1"/>
    </g>
    <!-- one gold cereal square caught in the mouth -->
    <rect x="7" y="3" width="1" height="1" fill="#c4a86a"/>
  </g>
</svg>
